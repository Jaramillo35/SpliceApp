# Dev stack for the harness platform.
#   docker compose up --build            → starts the Streamlit app (:8501) + splice-api (:8000)
#   docker compose --profile ai up       → also starts Ollama + Weaviate (assistant / Phase 5)
name: harness-platform

services:
  # The migrated NiceGUI surface (ui-ux-upgrade branch) — runs alongside the
  # Streamlit UI during the migration, sharing the same data volume.
  splice-nicegui:
    build:
      context: .
      dockerfile: Dockerfile.nicegui
      args:
        # exported by the Start/Update scripts; "unknown" on a bare `compose up`
        GIT_SHA: ${GIT_SHA:-unknown}
        GIT_BRANCH: ${GIT_BRANCH:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: harness-platform/splice-nicegui:0.1.0
    container_name: splice-nicegui
    ports:
      - "8504:8504"
    environment:
      SPLICE_DATA_DIR: /data
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - splice-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8504/',timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  splice-ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: harness-platform/splice-ui:0.1.0
    container_name: splice-ui
    ports:
      - "8501:8501"
    environment:
      SPLICE_DATA_DIR: /data
      # Reaches the optional Ollama service when the "ai" profile is up;
      # otherwise the assistant page degrades gracefully.
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - splice-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health',timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  splice-api:
    build:
      context: .
      dockerfile: splice_api/Dockerfile
    image: harness-platform/splice-api:0.1.0
    container_name: splice-api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # --- Optional AI stack (Phase 5) — present as scaffold, NOT yet wired to the API. ---
  # Gated behind the "ai" profile so the default `up` does not start them.
  ollama:
    profiles: ["ai"]
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  weaviate:
    profiles: ["ai"]
    image: cr.weaviate.io/semitechnologies/weaviate:1.27.0
    container_name: weaviate
    ports:
      - "8080:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
    volumes:
      - weaviate:/var/lib/weaviate
    restart: unless-stopped

volumes:
  splice-data:
  ollama:
  weaviate:
