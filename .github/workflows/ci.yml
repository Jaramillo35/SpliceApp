name: CI

# Runs on every push and PR. The whole suite runs: the ~900 tests added since
# this file was first written run on committed synthetic fixtures, and the few
# that need proprietary samples skip themselves when those are absent. For a
# long stretch CI ran 14 tests of 900+, so the safety net existed only on the
# developer's laptop and gated nothing.

on:
  push:
  pull_request:

jobs:
  test:
    name: lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (engine + both UIs + service + test tooling)
        run: |
          python -m pip install --upgrade pip
          pip install -e .                                    # splice + splice_api importable
          pip install -r requirements-nicegui.txt             # nicegui app + engines
          pip install -r splice_api/requirements-runtime.txt  # fastapi/uvicorn/multipart
          pip install ruff httpx pytest

      - name: Ruff (service code)
        run: ruff check splice_api tests/test_splice_api.py tests/test_dtx_golden.py tests/fixtures/dtx_golden/build_fixtures.py

      - name: Ruff (repo-wide, structural rules only)
        # Blind excepts and silent passes hide real failures. Style rules are
        # left out until the existing debt is paid down; these must not grow.
        run: ruff check . --select BLE001,S110,B023,F821,F811 --output-format=github
        continue-on-error: true

      - name: Pytest (whole suite)
        # Data-dependent cases skip automatically when the proprietary samples
        # are absent, as they are here.
        run: pytest -q

  docker:
    name: build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build splice-api image
        run: docker build -f splice_api/Dockerfile -t splice-api:ci .

      - name: Smoke test /health
        run: |
          docker run -d --name splice-api -p 8000:8000 splice-api:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health; then echo; echo "healthy"; break; fi
            sleep 2
          done
          curl -fs http://localhost:8000/health
          docker rm -f splice-api
