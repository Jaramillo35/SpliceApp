name: CI

# Runs on every push and PR once this repo is on GitHub. Scoped to the Phase 1-3 work
# (splice-api + engine golden guard); the broader legacy suites need the optional UI deps
# and proprietary data fixtures, so they are intentionally not part of this pipeline yet.

on:
  push:
  pull_request:

jobs:
  test:
    name: lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (engine + service + test tooling)
        run: |
          python -m pip install --upgrade pip
          pip install -e .                                    # splice + splice_api importable
          pip install -r splice_api/requirements-runtime.txt  # fastapi/uvicorn/multipart
          pip install ruff httpx pytest

      - name: Ruff (service code)
        run: ruff check splice_api tests/test_splice_api.py tests/test_dtx_golden.py tests/fixtures/dtx_golden/build_fixtures.py

      - name: Pytest
        # Data-dependent cases skip automatically when the proprietary Validatehere samples
        # are absent (they are, in CI); the golden guard runs on committed synthetic fixtures.
        run: pytest -q tests/test_splice_api.py tests/test_dtx_golden.py tests/test_dtx_enhanced_report.py

  docker:
    name: build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build splice-api image
        run: docker build -f splice_api/Dockerfile -t splice-api:ci .

      - name: Smoke test /health
        run: |
          docker run -d --name splice-api -p 8000:8000 splice-api:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health; then echo; echo "healthy"; break; fi
            sleep 2
          done
          curl -fs http://localhost:8000/health
          docker rm -f splice-api
